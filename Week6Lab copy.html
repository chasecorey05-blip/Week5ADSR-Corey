<!DOCTYPE html>
<html lang = "en">
<meta charset="UTF-8">
<title>ADSR_Works</title>
</head>
<body>

    <button id="button1">Play1st</button>
    <button id="button2">Play2nd</button>
    <button id="button3">Play3rd</button>
    <button id="button4">Play4th</button>

    <script>
        function playNote1(someContext, frequency, duration)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);

        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.01;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain.gain.value = 0;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.exponentialRampToValueAtTime(0.060, now + 0.01); //attack
            gain.gain.exponentialRampToValueAtTime(0.20, now + 0.01 + 0.08) //decay
            gain.gain.exponentialRampToValueAtTime(0.60, now + 0.01 + 0.08 + 0.9)
            gain.gain.exponentialRampToValueAtTime(0.1, now + duration); //release



            osc1.start();
            osc1.stop(now + duration);

            osc2.start();
            osc2.stop(now + duration);

        }

        const myCtx = new AudioContext();
        let freq = 220
        let dur = 1;

        document.querySelector("#button1").onclick = () => playNote1(myCtx, freq, dur);

         function playNote2(someContext, frequency, duration)
 {
            const osc3 = new OscillatorNode(someContext);
            const osc4 = new OscillatorNode(someContext);
            const gain2 = new GainNode(someContext);
        
            
            osc3.frequency.value = frequency;
            osc4.frequency.value = frequency*2.01;
            osc3.type = "triangle"
            osc4.type = "triangle"
            gain2.gain.value = 0;

            osc3.connect(gain2).connect(someContext.destination);
            osc4.connect(gain2).connect(someContext.destination);

            let now = someContext.currentTime;

            gain2.gain.exponentialRampToValueAtTime(0.30, now + 0.01); //attack
            gain2.gain.exponentialRampToValueAtTime(0.10, now + 0.01 + 0.08) //decay
            gain2.gain.exponentialRampToValueAtTime(0.30, now + 0.01 + 0.08 + 0.9)
            gain2.gain.exponentialRampToValueAtTime(0.1, now + duration); //release



            osc3.start();
            osc3.stop(now + duration);

            osc4.start();
            osc4.stop(now + duration);

        }

        const myCtx2 = new AudioContext();
        let freq2 = 220
        let dur2 = 1;

        document.querySelector("#button2").onclick = () => playNote2(myCtx2, freq2 * 2, dur2 * 0.2);
       

        function playNote3(someContext, frequency, duration)
 {
            const osc5 = new OscillatorNode(someContext);
            const osc6 = new OscillatorNode(someContext);
            const gain3 = new GainNode(someContext);
        
            
            osc5.frequency.value = frequency;
            osc6.frequency.value = frequency*2.01;
            osc5.type = "triangle"
            osc6.type = "triangle"
            gain3.gain.value = 0;

            osc5.connect(gain3).connect(someContext.destination);
            osc6.connect(gain3).connect(someContext.destination);

            let now = someContext.currentTime;

            gain3.gain.exponentialRampToValueAtTime(0.10, now + 0.01); //attack
            gain3.gain.exponentialRampToValueAtTime(0.90, now + 0.01 + 0.08) //decay
            gain3.gain.exponentialRampToValueAtTime(0.30, now + 0.01 + 0.08 + 0.9)
            gain3.gain.exponentialRampToValueAtTime(0.1, now + duration); //release



            osc5.start();
            osc5.stop(now + duration);

            osc6.start();
            osc6.stop(now + duration);

        }

        const myCtx3 = new AudioContext();
        let freq3 = 220
        let dur3 = 1;

        document.querySelector("#button3").onclick = () => playNote3(myCtx3, freq3 * 2.5, dur3 * 0.2);


        function playNote4(someContext, frequency, duration)
 {
            const osc7 = new OscillatorNode(someContext);
            const osc8 = new OscillatorNode(someContext);
            const gain4 = new GainNode(someContext);
        
            
            osc7.frequency.value = frequency;
            osc8.frequency.value = frequency*2.01;
            osc7.type = "triangle"
            osc8.type = "triangle"
            gain4.gain.value = 0;

            osc7.connect(gain4).connect(someContext.destination);
            osc8.connect(gain4).connect(someContext.destination);

            let now = someContext.currentTime;

            gain4.gain.exponentialRampToValueAtTime(0.60, now + 0.01); //attack
            gain4.gain.exponentialRampToValueAtTime(0.90, now + 0.01 + 0.08) //decay
            gain4.gain.exponentialRampToValueAtTime(0.30, now + 0.01 + 0.08 + 0.9)
            gain4.gain.exponentialRampToValueAtTime(0.1, now + duration); //release



            osc7.start();
            osc7.stop(now + duration);

            osc8.start();
            osc8.stop(now + duration);

        }

        const myCtx4 = new AudioContext();
        let freq4 = 220
        let dur4 = 1;

        document.querySelector("#button4").onclick = () => playNote4(myCtx4, freq4 * 2.75, dur4 * 0.2);




    </script>
    
</body>

</html>
